name: Bug Report
description: Report a bug or unexpected behavior
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting a bug! Please fill out the sections below.

  - type: markdown
    attributes:
      value: |
        Maintainers rate every confirmed issue from 1 to 10 (`difficulty:N`) to help contributors
        choose. How it works: [docs/issue-difficulty.md](https://github.com/MakazhanAlpamys/Soup/blob/main/docs/issue-difficulty.md).
        Please search first, and keep to one defect per issue. Security problems: do NOT open an
        issue; see [SECURITY.md](https://github.com/MakazhanAlpamys/Soup/blob/main/SECURITY.md).

  - type: textarea
    id: description
    attributes:
      label: Description
      description: What happened? What did you expect to happen?
    validations:
      required: true

  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      description: Minimal steps to reproduce the issue
      placeholder: |
        1. pip install soup-cli
        2. soup train --config soup.yaml
        3. See error...
    validations:
      required: true

  - type: textarea
    id: config
    attributes:
      label: Config (soup.yaml)
      description: Paste your config file if relevant
      render: yaml

  - type: textarea
    id: error
    attributes:
      label: Error output
      description: Paste the full error (use `--verbose` for traceback)
      render: shell

  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Run `soup doctor` and paste the output
      render: shell
    validations:
      required: true

  - type: dropdown
    id: suggested_difficulty
    attributes:
      label: Suggested difficulty (optional)
      description: Your guess at how hard the fix is. A maintainer sets the final number.
      options:
        - "Not sure"
        - "1 - wording or one-line fix"
        - "2 - one file, fix is clear"
        - "3 - one module, small change"
        - "4 - a few files, existing pattern"
        - "5 - needs understanding a pipeline"
        - "6 - several tasks or backends"
        - "7 - new mechanism, needs a measurement"
        - "8 - cause unknown or hard to reproduce"
        - "9 - new subsystem or needs special hardware"
        - "10 - research-grade"
      default: 0
