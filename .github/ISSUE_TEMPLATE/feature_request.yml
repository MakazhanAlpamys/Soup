name: Feature Request
description: Suggest a new feature or improvement
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Have an idea for Soup? We'd love to hear it!

  - type: markdown
    attributes:
      value: |
        Maintainers rate every confirmed issue from 1 to 10 (`difficulty:N`) to help contributors
        choose. How it works: [docs/issue-difficulty.md](https://github.com/MakazhanAlpamys/Soup/blob/main/docs/issue-difficulty.md).
        Please search existing issues first.

  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What problem does this feature solve?
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: Proposed solution
      description: How would you like this to work?
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Any other approaches you've thought about?

  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Training (SFT/DPO/GRPO)
        - Data tools
        - CLI / UX
        - Export / Serve
        - Experiment tracking
        - Other
    validations:
      required: true

  - type: dropdown
    id: suggested_difficulty
    attributes:
      label: Suggested difficulty (optional)
      description: Your guess at how hard this is to build. A maintainer sets the final number.
      options:
        - "Not sure"
        - "1 - wording or one-line fix"
        - "2 - one file, fix is clear"
        - "3 - one module, small change"
        - "4 - a few files, existing pattern"
        - "5 - needs understanding a pipeline"
        - "6 - several tasks or backends"
        - "7 - new mechanism, needs a measurement"
        - "8 - cause unknown or hard to reproduce"
        - "9 - new subsystem or needs special hardware"
        - "10 - research-grade"
      default: 0
