name: CI

on:
  push:
    # `release/**` is here so a release branch gets the matrix on the exact
    # tree that will be tagged. A pull request builds the MERGE of head and
    # main, which for a release cut from an older tag is not the tree that
    # ships, so a PR run cannot stand in for this one.
    branches: [main, 'release/**']
    # A push that touches only these paths starts no run (a pull request is NOT
    # filtered: it has no `paths` / `paths-ignore`, so every required context still
    # reports on every pull request). Measured 2026-10-19 over 7 days: 15 of 131
    # pushes to main were docs-only credit commits, each a full quick run (about 20
    # runner-minutes), 303 minutes in all. What it gives up: tests read these paths
    # (the changelog fragments, CONTRIBUTING.md, CONTRIBUTORS.md, docs/), so a docs-only
    # push that breaks one of them shows in the nightly run instead of on its own
    # commit; the same change as a pull request is still tested. `release/**` shares the
    # filter, which is fine: a release cut carries a version bump and code, never docs
    # alone, and a docs-only tip can be run by hand with workflow_dispatch.
    paths-ignore:
      - 'docs/**'
      - 'changelog.d/**'
      - 'CONTRIBUTORS.md'
      - 'CONTRIBUTING.md'
  pull_request:
    branches: [main]
    # The first three are GitHub's defaults. `ready_for_review` is a draft's first
    # run: a draft pull request runs nothing. `labeled` is what starts the approval
    # run when a maintainer adds `ci:full`. Both are in the comment above the
    # `plan` job. It stays a plain pull_request run -- never pull_request_target.
    types: [opened, synchronize, reopened, ready_for_review, labeled]
  # The full matrix on `main`, once a night: a push to `main` itself runs only the
  # quick set (see the comment above the `plan` job). `workflow_dispatch` lets a
  # maintainer start the same full run by hand.
  schedule:
    - cron: '23 3 * * *'
  workflow_dispatch:

# Supersede, do not queue.
#
# Measured 2026-09-14: 49 of 83 queued runs were already obsolete -- a newer run
# existed on the same branch -- because no workflow declared a concurrency group,
# so every push left its predecessor queued forever. Arrival was 8.3 runs/hour
# against a service rate of 4.6, i.e. the queue diverged rather than backed up.
#
# Cancellation is deliberately PULL-REQUEST ONLY, and the GROUP KEY is what
# enforces that -- not `cancel-in-progress`. Measured 2026-09-14, after the
# first version of this block shipped: `cancel-in-progress: false` protects a
# run that is already RUNNING and does nothing for one still PENDING on the
# group. Four consecutive pushes to `main` lost their runs that way, each
# cancelled within two seconds of the next one starting (b0a63382 cancelled at
# 14:17:33, 52641e99 started 14:17:31), which is the exact opposite of what the
# comment here used to claim. So a push keys the group on the COMMIT and is
# therefore alone in it; a pull request keys on the ref and supersedes itself.
# The release checklist requires a green matrix on the exact commit being
# tagged, and that now survives a later push instead of depending on a freeze.
#
# What this costs: per-commit CI history WITHIN a pull request. Three pushes in
# a row now leave results for the third only. That is a signal the review rule
# already discards -- merge requires green on the CURRENT head -- which is why
# it is the right thing to trade.
#
# 2026-10-01: every push is alone in its own group again -- keyed on the event and
# the commit -- because a push to `main` now runs only the QUICK set (about three
# jobs, not fifteen). The shared 'main-push' group below traded a result per commit
# for runner capacity; with a cheap per-commit run and the full matrix once a night
# the same capacity buys a green or red mark on every `main` commit, where the
# shared group left 'cancelled' on all but the last of a burst of merges (seen
# 2026-10-01: 22 merges in two hours, red crosses on every commit but two).
#
# 2026-09-28 (superseded by the paragraph above): pushes to `main` shared ONE group, keyed 'main-push'. Measured
# that morning: 24 of 70 queued runs were full matrices for main commits (about
# 15 merges plus credit commits in a day), each alone in its per-commit group,
# so main's own history consumed roughly a third of the queue while every
# merged change had already passed the matrix on its pull request. In the shared
# group a RUNNING main run still finishes (cancel-in-progress stays PR-only), and
# a newer push supersedes only the PENDING one, so main carries at most one
# running and one pending run and the newest commit always gets a result.
# What this costs: intermediate main commits may show 'cancelled' instead of a
# result, so a breakage is bisected over a range rather than read off one
# commit. `release/**` keeps the per-commit key, because the release checklist
# needs a green matrix on the exact commit being tagged.
concurrency:
  # A run started by adding any label other than `ci:full` keys on its run id, so
  # nothing shares its group: it cannot cancel a full matrix already running on
  # the pull request, and no later push cancels it. Adding `ci:full` keys on the
  # ref like every other pull-request event, so the full run supersedes the quick
  # one. The whole policy is in the comment above the `plan` job.
  group: ${{ github.workflow }}-${{ github.event.action == 'labeled' && github.event.label.name != 'ci:full' && format('labeled-{0}', github.run_id) || github.event_name == 'pull_request' && github.ref || format('{0}-{1}', github.event_name, github.sha) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Bound every job explicitly.
#
# Until now only `pytorch-smoke` declared a `timeout-minutes`, so every other
# job inherited GitHub's 360-minute default -- six hours per cell, across a 3x3
# matrix, before the platform intervenes at all.
#
# The prompt for this was #763, where `test (windows-latest, 3.11)` sat
# `pending` at 0 seconds for ~22 hours. It could not be cleared by hand:
# `gh run rerun --job` refuses a job that has never started, so the only exit
# was GitHub's own eviction of a never-scheduled job at the 24-hour mark.
#
# READ THIS BEFORE EXPECTING THE VALUES BELOW TO PREVENT THAT -- they do not.
# `timeout-minutes` starts counting when a job ACQUIRES a runner, not when it
# is created, so queued time is not charged against it and a job that never
# starts is not covered by any number here. That half needs the auto-retrigger
# tracked in #1017. What these bound is the other half of the same incident: a
# job that does start and then hangs, which today burns 360 minutes before it
# shows up as anything a reviewer can act on.
#
# Values are ~2x the slowest SUCCESSFUL duration observed over 15 recent
# completed runs on `main` and on pull requests -- execution time only
# (created_at -> started_at was 4-5s in that sample, so queueing is not folded
# into these figures):
#
#   job                        median   max   ->  limit
#   test (windows-latest, *)     41.5  44.6       90
#   test (ubuntu/macos, *)       ~25   31.8       90   (one value for the matrix)
#   pytorch-smoke                 2.6  11.1       20   (unchanged)
#   transformers-floor            2.5   2.8       20
#   mlx-smoke                     0.8   0.9       20
#   type-check                    0.3   0.4       15
#   lint                          0.2   0.2       15
#
# The short jobs are deliberately NOT set to 2x their measured time. Each of
# them installs over the network -- pip, and for `lint` a release tarball from
# the GitHub CDN with `--retry 3 --retry-all-errors` behind it -- so their
# realistic worst case is a slow mirror, not slow compute, and a 15-20 minute
# floor is what absorbs that. A timeout that fires on a legitimately slow run
# is worse than no timeout, because it teaches people to re-run a red cell
# instead of reading it.
#
# `test` takes a single value rather than a per-OS expression: 90 is slack for
# ubuntu/macos, but the alternative is arithmetic in a matrix expression to
# save runner-minutes that are only ever spent when a job is already hung.
#
# 2026-10-20: `test` is 60, not 90, and its two pytest steps carry a limit of
# their own (45; see the first of them). The table above predates the parallel
# run (2026-10-07). Measured 2026-10-12..19 over 1145 successful `test` jobs: the
# slowest took 37.5 minutes (Windows, before the warm-cache fix of 2026-10-19
# took 6.3 of them; 23.3 since), ubuntu 31.0, macOS 31.7. 60 is 1.6x the slowest
# and leaves 15 minutes above the step limit for checkout, install and the warm-up.
# What it saves: a job that hangs ends 30 minutes sooner (the nightly run of
# 2026-10-20 held one Windows cell for the full 90).

jobs:
  # Quick runs, the required cells at approval, the full matrix every night, and
  # every cell on a release branch.
  #
  # Measured 2026-09-28 07:30Z: the Actions account sat at its free-plan cap of
  # 20 concurrent jobs (8 ubuntu, 8 windows, 4 macos running) with 301 jobs
  # queued, and every push to a pull request cost 15 jobs of this workflow: the
  # nine test cells plus lint, type-check, mlx-smoke, torchao-contract,
  # pytorch-smoke and transformers-floor.
  #
  # So `plan` picks one of four matrices, and every job except `lint` follows it:
  #
  #   push to release/**               RELEASE: all nine test cells + the six gated jobs
  #   nightly run on main, a manual    FULL: seven test cells (no Windows or macOS
  #     dispatch                         on 3.11) + the six gated jobs
  #   pull request labelled ci:full    APPROVAL: the four required test cells (ubuntu
  #                                      on 3.11 and 3.12, Windows and macOS on
  #                                      3.12) + the four gated jobs that run on a
  #                                      pull request (not type-check, not
  #                                      torchao-contract: 2026-10-19, below)
  #   push to main, any other pull     QUICK: lint + test (ubuntu-latest, 3.12)
  #     request run
  #   draft pull request               nothing: no job starts
  #
  # 3.11 runs on ubuntu in every FULL run, and on Windows and macOS only for
  # release/**, where the release checklist needs every cell green on the tagged
  # commit. Measured basis (soup-97): macOS was the binding limit 63% of the
  # time, and dropping the two cells takes a full run from 4 macOS jobs to 3
  # (x1.33 on that limit). What it gives up: 3 of 64 failing attempts failed on
  # windows-3.11 alone, and a failure like that now surfaces on the release
  # branch instead of before merge. Branch protection requires neither cell.
  # Since #1805 (2026-10-21) 3.11 is the oldest supported Python, so Windows and
  # macOS meet the floor on release/** only; FULL spends those two slots on 3.13.
  #
  # 2026-10-21 (#1805): the support matrix is 3.11 / 3.12 / 3.13. 3.10 left it (end
  # of life on 2026-10-01), 3.13 joined it, and requires-python moved with them to
  # ">=3.11,<3.14" (tests/test_requires_python_bound.py derives the bound from
  # RELEASE). 3.13 runs on every OS in FULL and RELEASE and in no pull-request run:
  # QUICK and APPROVAL stay on 3.12, so a new interpreter cannot turn every open
  # pull request red at once (the reasoning of the pinned stack below). What it
  # gives up: a failure that exists only on 3.13 shows on `main` in the next nightly
  # run, not before merge. Moving the pull-request gate to 3.13 later means changing
  # APPROVAL, QUICK, the cell `RUN_SUITE` keeps and branch protection together
  # (tests/test_ci_full_matrix_on_approval.py names every one of them).
  #
  # 2026-10-07: a labelled pull request runs APPROVAL, no longer FULL. An approval
  # run was seven test cells, two of them on macOS, the binding limit above; it is
  # four, one on macOS. What it gives up: a failure that exists only on a
  # nightly-only cell (then ubuntu 3.11, Windows 3.10 and macOS 3.10; since #1805
  # the three 3.13 cells) is not caught before merge and shows on `main` in the
  # next nightly run instead. Branch protection must not require any of the
  # three: they came off it together with this change.
  #
  # A quick push costs 3 jobs (lint, plan, one ubuntu cell) instead of 15, and
  # none of them on Windows or macOS. A maintainer adds `ci:full` at approval.
  # The pull request's current labels decide, not the event, so every run on a
  # labelled pull request is an approval run -- including each later push, which
  # a merge on the current head needs anyway. Remove the label to go back to
  # quick runs. A
  # labelled run is an ordinary pull_request run, with the token and secrets a
  # push to that pull request already gets.
  #
  # What this costs, and why the merge gate still holds:
  #
  # - Contributors see only ubuntu / Python 3.12 until approval. A failure that
  #   exists only on Windows, macOS or 3.11 surfaces at approval, so that round
  #   trip starts later than it used to. One that needs 3.13, on any OS, surfaces
  #   after the merge, in the nightly run; one that needs Windows or macOS on 3.11,
  #   on the release branch.
  # - The required smokes (mlx-smoke, pytorch-smoke, transformers-floor) read as
  #   SKIPPED on a quick run, and branch protection counts a job skipped by its
  #   `if:` as passing. So the smokes are not what blocks a merge; the test cells
  #   are. `test` takes its matrix from `plan`, so a quick run never CREATES the
  #   other three required `test (...)` contexts, and a required context nothing
  #   reported stays "Expected" and keeps the merge button locked. Do not turn the
  #   matrix back into a static list with a per-cell `if:`: a skipped cell passes.
  #   For the same reason APPROVAL and branch protection must name the same
  #   cells: a required cell APPROVAL drops is never reported and locks every
  #   merge, and an APPROVAL cell that is not required gates nothing.
  # - Maintainers merge only when all 8 required checks read SUCCESS on the
  #   current head. Skipped is not success: a quick run after an approval run on the
  #   same head (say the label was removed and another one added) replaces the
  #   smokes' results, a failure included, with skipped -- which the merge button
  #   accepts.
  # - Adding any other label to a pull request that already carries `ci:full`
  #   starts a second approval run, in a concurrency group of its own so it cannot
  #   cancel the first, and no later push cancels it either. Add other labels
  #   before `ci:full`.
  # - Coverage is not measured on a pull request at all (2026-10-21). The one cell that
  #   measures it, enforces the 77% floor and uploads to Codecov is `test (ubuntu-latest,
  #   3.11)` of a run that is NOT a pull request: the nightly run, a manual dispatch and
  #   a push to release/**. Every cell of a pull-request run, that cell at approval
  #   included, runs the suite with `--no-cov`. What it gives up: a pull request has no
  #   Codecov report, and one that drops coverage below the floor merges green and turns
  #   the next nightly run red, on `main`. A push to `main` is a quick run, which has no
  #   ubuntu / 3.11 cell (it never did), so it does not measure either.
  # - A draft pull request runs nothing: `plan` and `lint` are skipped by their
  #   own `if:`, and every other job needs `plan`. The merge gate holds for the
  #   reason above -- the required `test (...)` contexts are never created -- and
  #   GitHub does not merge a draft in any case. Marking it ready
  #   (`ready_for_review`) starts the quick run, or the approval run if it already
  #   carries the label. Converting a pull request back to a draft does not stop a
  #   run in progress. A job added here must need `plan` and must not call a
  #   status function (`always()`, `failure()`, ...) in its `if:`, or it runs on
  #   drafts.
  #
  # 2026-10-12: `plan` also picks the upstream stack. QUICK and APPROVAL (every
  # pull-request run, every push to main) install under
  # .github/constraints/pinned-upstream.txt; FULL and RELEASE install with no
  # constraints and resolve the newest release of everything. So one release
  # upstream no longer fails every open pull request at once: it turns the
  # nightly run red, on `main`, once. The jobs that install the project end
  # every `pip install` with `plan`'s `constraints` output, `-c <that file>` or
  # nothing. Do not write the `-c` into a step: that pins the nightly run too,
  # and a pinned nightly run stays green and says nothing. When and how to bump
  # the pins is in the header of that file.
  #
  # 2026-10-20: `plan` also decides `docs_only`: true only for a pull request whose EVERY
  # changed file is under docs/ or changelog.d/ or is CONTRIBUTORS.md or CONTRIBUTING.md,
  # read from the pull request's own file list (`gh api .../pulls/N/files`, a rename
  # counted by both names) and false on any API error, an empty list, or a list shorter
  # than the pull request's `changed_files` (the endpoint stops at 3000 files). README*.md
  # and benchmarks/ are NOT in the set: tests read them. When it is true the suite runs
  # ONCE: `test (ubuntu-latest, 3.12)` is exactly what it was, and every step of the
  # other test cells and of the three smoke jobs is skipped by its own `if:`. The jobs are
  # not skipped, their steps are: a job skipped by its `if:` reads "skipped", while a job
  # whose steps are all skipped reports SUCCESS, which is what every required context
  # should read. Measured 2026-10-12..19: about 136 job-minutes a day went to the other
  # cells and the smokes of pull requests that changed only these paths (about 185 before
  # the warm-cache fix of 2026-10-19). What it gives up: a docs-only change that breaks a
  # test only on Windows, macOS or Python 3.11 (a test that reads one of these paths)
  # shows in the nightly run instead; ubuntu / 3.12 still runs every test. A push, the
  # nightly run, a manual dispatch and a release branch are not affected: `docs_only` is
  # false for them. Never filter `pull_request` by `paths` for this: a filtered workflow
  # reports nothing and every required context would stay "Expected".
  #
  # `timeout-minutes: 5` is not a measurement: one shell step, no checkout, no
  # install.
  plan:
    # Everything but a draft pull request. `lint` carries the same condition, and
    # every other job needs `plan`, so it is skipped with it.
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    timeout-minutes: 5
    # Only what the docs-only step reads: the pull request's file list. There is no
    # checkout, so no `contents`; naming one permission makes every other one `none`.
    permissions:
      pull-requests: read
    env:
      # The four matrices, each declared once as a JSON literal the tests parse.
      # RELEASE is the support matrix, every cell: tests/test_requires_python_bound.py
      # derives requires-python from it. FULL is RELEASE minus Windows and macOS on
      # 3.11. APPROVAL is the oldest Python and the newest one a pull request runs
      # (3.12: 3.13 is FULL and RELEASE only, see above), the oldest on ubuntu
      # only, and tests/test_ci_full_matrix_on_approval.py pins it to exactly the
      # required `test (...)` contexts. QUICK is one required cell. Keep the key
      # order (it names the checks) and the versions as strings (a JSON 3.10 is 3.1).
      RELEASE_MATRIX: >-
        {"os": ["ubuntu-latest", "windows-latest", "macos-latest"],
        "python-version": ["3.11", "3.12", "3.13"]}
      FULL_MATRIX: >-
        {"os": ["ubuntu-latest", "windows-latest", "macos-latest"],
        "python-version": ["3.11", "3.12", "3.13"],
        "exclude": [{"os": "windows-latest", "python-version": "3.11"},
        {"os": "macos-latest", "python-version": "3.11"}]}
      APPROVAL_MATRIX: >-
        {"os": ["ubuntu-latest", "windows-latest", "macos-latest"],
        "python-version": ["3.11", "3.12"],
        "exclude": [{"os": "windows-latest", "python-version": "3.11"},
        {"os": "macos-latest", "python-version": "3.11"}]}
      QUICK_MATRIX: '{"os": ["ubuntu-latest"], "python-version": ["3.12"]}'
      # The pinned upstream stack, named once. QUICK and APPROVAL hand it to the
      # jobs as `-c <path>`; FULL and RELEASE hand them nothing.
      PINNED_CONSTRAINTS: .github/constraints/pinned-upstream.txt
    outputs:
      full: ${{ steps.decide.outputs.full }}
      matrix: ${{ steps.decide.outputs.matrix }}
      constraints: ${{ steps.decide.outputs.constraints }}
      docs_only: ${{ steps.docs.outputs.docs_only }}
    steps:
      - name: Choose the release, full, approval or quick matrix
        id: decide
        env:
          RELEASE: ${{ github.event_name == 'push' && startsWith(github.ref, 'refs/heads/release/') }}
          FULL: ${{ github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && startsWith(github.ref, 'refs/heads/release/')) }}
          APPROVAL: ${{ github.event_name == 'pull_request' && contains(github.event.pull_request.labels.*.name, 'ci:full') }}
        run: |
          set -euo pipefail
          if [ "$RELEASE" = "true" ]; then
            full=true
            matrix="$RELEASE_MATRIX"
            constraints=""
          elif [ "$FULL" = "true" ]; then
            full=true
            matrix="$FULL_MATRIX"
            constraints=""
          elif [ "$APPROVAL" = "true" ]; then
            full=true
            matrix="$APPROVAL_MATRIX"
            constraints="-c $PINNED_CONSTRAINTS"
          else
            full=false
            matrix="$QUICK_MATRIX"
            constraints="-c $PINNED_CONSTRAINTS"
            echo "::notice title=Quick CI run::lint and test (ubuntu-latest, 3.12) only. A pull request gets the other required test cells and the smoke jobs when a maintainer adds the ci:full label; main gets the full matrix every night."
          fi
          {
            echo "full=$full"
            echo "matrix=$matrix"
            echo "constraints=$constraints"
          } >> "$GITHUB_OUTPUT"

      - name: Detect a docs-only pull request
        # `true` only when the pull request's file list is non-empty, complete, and every
        # name on it (a rename counts both its old and its new one) is a docs path. Every
        # other outcome is `false`, an API error included: the worst a wrong `false` costs
        # is the full run this job exists to avoid, the worst a wrong `true` costs is a
        # test cell that did not run. The values come in through `env:`, never into the
        # script text.
        id: docs
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT_NAME: ${{ github.event_name }}
          REPOSITORY: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          CHANGED_FILES: ${{ github.event.pull_request.changed_files }}
        run: |
          set -u
          docs_only=false
          is_docs() {
            case "$1" in
              docs/*|changelog.d/*|CONTRIBUTORS.md|CONTRIBUTING.md) return 0 ;;
              *) return 1 ;;
            esac
          }
          if [ "$EVENT_NAME" = "pull_request" ] && [ -n "$PR_NUMBER" ]; then
            if rows=$(gh api "repos/${REPOSITORY}/pulls/${PR_NUMBER}/files" --paginate --jq '.[] | [.filename, .previous_filename] | @tsv'); then
              # No file at all reads as ONE blank row, and a blank name is not a docs path,
              # so an empty list counts against `docs_only` without a check of its own.
              total=0
              other=0
              while IFS=$'\t' read -r name previous; do
                total=$((total + 1))
                is_docs "$name" || other=$((other + 1))
                if [ -n "$previous" ]; then
                  is_docs "$previous" || other=$((other + 1))
                fi
              done <<< "$rows"
              if [ "$other" -eq 0 ] && [ "$total" = "$CHANGED_FILES" ]; then
                docs_only=true
              fi
            else
              echo "::warning title=Docs-only check::could not read the pull request's file list; running the full set"
            fi
          fi
          echo "docs_only=$docs_only" >> "$GITHUB_OUTPUT"

  lint:
    # Skipped on a draft pull request, like `plan`: see the comment above `plan`.
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install ruff
      # benchmarks/harness/ carries real parsing logic — mlx_sft_smoke.py
      # derives the published throughput figure from mlx-lm's stdout — but was
      # outside this line until now, so a lint error there could not turn CI red.
      - run: ruff check src/soup_cli/ scripts/ tests/ benchmarks/
      - name: Lint the workflows themselves
        # `check-yaml` and a YAML parser both accept a workflow GitHub will
        # reject: 195d60b used the `runner` context in a job-level `env:` block,
        # which is valid YAML and invalid Actions, and the whole matrix died
        # before any job produced a log. actionlint checks context availability,
        # expression syntax, action inputs, and shellchecks `run:` blocks.
        #
        # Installed as the pinned upstream release binary with its published
        # SHA-256 checked, NOT via `go install`. That is a stronger supply-chain
        # position than building from source -- the bytes that run are verified
        # against a hash committed here -- and it removes the failure that took
        # this job down on 2026-08-31: actionlint v1.7.12 declares
        # `go >= 1.25.0`, ubuntu-latest ships go 1.24.13, so `go install`
        # silently switched toolchains and died fetching one:
        #
        #   go: switching to go >= 1.25.0: module golang.org/toolchain:
        #   read ".../@v/list": stream error: INTERNAL_ERROR; received from peer
        #
        # A transient network fault in a job that is now a REQUIRED check blocks
        # every merge in the repository, so this step must not depend on an
        # implicit toolchain download. `--retry-all-errors` covers the rest.
        env:
          ACTIONLINT_VERSION: 1.7.12
          ACTIONLINT_SHA256: 8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8
        run: |
          set -euo pipefail
          url="https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          curl --fail --silent --show-error --location --retry 3 --retry-all-errors             --output "${RUNNER_TEMP}/actionlint.tar.gz" "$url"
          echo "${ACTIONLINT_SHA256}  ${RUNNER_TEMP}/actionlint.tar.gz"             | sha256sum --check --strict -
          tar -xzf "${RUNNER_TEMP}/actionlint.tar.gz" -C "${RUNNER_TEMP}" actionlint
          "${RUNNER_TEMP}/actionlint" -color

  type-check:
    needs: plan
    # Not on a pull request, approval run included: it is not a required check and
    # never fails (see below), so a pull request gained nothing from it. Measured
    # 2026-10-19: 206 pull-request runs in 7 days, 59 job-minutes. It still runs in
    # the nightly, manual and release runs.
    if: needs.plan.outputs.full == 'true' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Non-blocking type-check baseline. The codebase adopts annotations
    # incrementally, so mypy findings are surfaced as a warning annotation (and
    # in the step log) but do NOT fail the job — the check stays green until
    # types are tightened enough to promote it to a required gate. Reads
    # [tool.mypy] from pyproject.toml (files = ["src/soup_cli"],
    # ignore_missing_imports = true).
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install mypy
      - name: mypy (non-blocking)
        run: |
          mypy || echo "::warning title=mypy::Type issues reported (non-blocking baseline — see the log above)"

  mlx-smoke:
    needs: plan
    if: needs.plan.outputs.full == 'true'
    # #394: prove the documented standalone install on an Apple Silicon runner.
    # Keep this separate from the main matrix because `.[dev]` deliberately
    # installs the PyTorch/TRL stack and would hide an accidental MLX dependency.
    runs-on: macos-14
    timeout-minutes: 20
    # Every step below carries `if: needs.plan.outputs.docs_only != 'true'` (2026-10-20): a
    # docs-only pull request reports this job as SUCCESS without doing its work (see the
    # comment above `plan`). A step added here needs the same condition.
    steps:
      - uses: actions/checkout@v4
        if: needs.plan.outputs.docs_only != 'true'
      - uses: actions/setup-python@v5
        if: needs.plan.outputs.docs_only != 'true'
        with:
          python-version: "3.12"
      - name: Install only the MLX runtime and smoke-test dependency
        if: needs.plan.outputs.docs_only != 'true'
        # Ends with `plan`'s stack (above `plan`); a constraint installs nothing, so torch stays absent.
        run: pip install -e ".[mlx]" pytest ${{ needs.plan.outputs.constraints }}
      - name: Verify MLX imports and the PyTorch training stack is absent
        if: needs.plan.outputs.docs_only != 'true'
        run: |
          python -c "import mlx.core, mlx_lm; print(mlx.core.__version__, mlx_lm.__version__)"
          python -c "import importlib.util; names=('torch','trl','datasets','peft','accelerate','bitsandbytes'); present=[name for name in names if importlib.util.find_spec(name)]; assert not present, f'unexpected training dependencies: {present}'"
      - name: Run one-step MLX SFT through the real CLI
        if: needs.plan.outputs.docs_only != 'true'
        run: pytest -o addopts= -m smoke -k mlx_sft_smoke -q tests/test_smoke_train.py
      - name: Run the MLX tests that need the real library
        if: needs.plan.outputs.docs_only != 'true'
        # These importorskip on `mlx.core` / `mlx_lm`, which the 3x3 matrix does
        # not install (`mlx` is not in [dev]), so this is the only job that can
        # execute them. Without this step, replacing the whole MLX per-row loss
        # with a constant 0.0 left the suite green (#1018 review). The DPO, ORPO
        # and eval-steps files (#1846, #2073, #2074) were missing from it: their
        # loss, gradient and training-loop tests ran on no job at all.
        # tests/test_ci_mlx_smoke_files.py fails when a tests/test_mlx_*.py that
        # needs the real library is neither listed here nor exempted there.
        run: pytest -o addopts= -q tests/test_rewind_mlx.py tests/test_mlx_dora_native.py tests/test_mlx_dpo.py tests/test_mlx_orpo.py tests/test_mlx_eval_steps.py tests/test_mlx_simpo.py tests/test_mlx_sft_seed.py tests/test_mlx_kto.py tests/test_mlx_grpo.py
  torchao-contract:
    needs: plan
    # Not on a pull request, approval run included: it is not a required check.
    # Measured 2026-10-19: 206 pull-request runs in 7 days, 421 job-minutes (2.0 each).
    # It still runs in the nightly, manual and release runs, so a torchao release that
    # renames a class shows on `main` the next night.
    if: needs.plan.outputs.full == 'true' && github.event_name != 'pull_request'
    # #826: every torchao class Soup names is resolved against the REAL package
    # here. The 3x3 matrix cannot do it -- `torchao` is not in `[dev]`, so those
    # cells skip these tests, which is how three names torchao never exported
    # (NVFP4Config, Int8DynActInt4Config, Float8DynActFloat8Config) survived
    # behind a stub and a MagicMock.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install the QAT extra (torchao) beside the dev stack
        # One spec with both extras: `-e ".[dev]" ".[qat]"` asks pip for
        # soup-cli twice, once editable and once not, and resolution fails.
        # Ends with `plan`'s stack: pinned on a pull request, the newest at night; torchao floats.
        # Deliberately NOT on the CPU torch index (2026-10-21), unlike the other Linux jobs:
        # that index also hosts `torchao`, as `0.18.0+cpu` (pure Python), and pip prefers it to
        # PyPI's `0.18.0` (the compiled abi3 wheel), so this job would test a build no user
        # installs from PyPI. It runs nightly and on release/** only, so the CUDA download is a
        # small cost. tests/test_ci_cpu_torch_on_linux.py names this exemption.
        run: pip install -e ".[dev,qat]" "torch>=2.6.0" ${{ needs.plan.outputs.constraints }}
      - name: Prove torchao is actually importable, so the tests do not skip
        run: python -c "import torchao; print(torchao.__version__)"
      - name: Resolve every torchao class Soup asks for
        # test_v07121.py runs here too, and not only in the matrix: it is the
        # suite that fakes torchao, so with the real package installed it is
        # the one that catches a resolver which answers from a cached
        # `torchao.*` submodule after the root import has been made to fail.
        # That exact regression shipped in this PR's first push and was found
        # by hand; running both files in one job is what makes it a CI failure
        # next time.
        run: |
          pytest -o addopts= -q \
            tests/test_issue826_torchao_class_names.py \
            tests/test_issue835_fp8_gate.py \
            tests/test_v07121.py
  pytorch-smoke:
    needs: plan
    if: needs.plan.outputs.full == 'true'
    # #596: exercise the real PyTorch SFT + DPO training pipeline on every PR.
    # Keep this separate from the 3x3 matrix so the expensive model-backed
    # smoke tests run once, not nine times.
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PYTHONUTF8: "1"
      PYTHONIOENCODING: "utf-8"

    # Every step below carries `needs.plan.outputs.docs_only != 'true'` in its `if:`
    # (2026-10-20): a docs-only pull request reports this job as SUCCESS without doing its
    # work (see the comment above `plan`). Mind the last step: `success()` is true when
    # everything before it was skipped. A step added here needs the same condition.
    steps:
      - uses: actions/checkout@v4
        if: needs.plan.outputs.docs_only != 'true'

      - uses: actions/setup-python@v5
        if: needs.plan.outputs.docs_only != 'true'
        with:
          python-version: "3.11"

      - name: Set HF cache location
        if: needs.plan.outputs.docs_only != 'true'
        run: echo "HF_HOME=$RUNNER_TEMP/hf-cache" >> "$GITHUB_ENV"

      - name: Restore PyTorch smoke HF cache
        if: needs.plan.outputs.docs_only != 'true'
        id: hf-cache
        uses: actions/cache/restore@v4
        with:
          path: ${{ runner.temp }}/hf-cache
          key: hf-pytorch-smoke-${{ runner.os }}-${{ hashFiles('tests/test_smoke_train.py', 'pyproject.toml') }}
          restore-keys: |
            hf-pytorch-smoke-${{ runner.os }}-

      - name: Install training dependencies
        if: needs.plan.outputs.docs_only != 'true'
        # torch>=2.6 is load-bearing, not belt-and-braces: sshleifer/tiny-gpt2
        # ships only pytorch_model.bin, and transformers refuses torch.load
        # below 2.6.0 under CVE-2025-32434. Removing this pin because "[dev]
        # already pulls torch" breaks the job with a message naming the CVE
        # rather than the cause.
        # Ends with `plan`'s stack: pinned on a pull request, the newest at night.
        # CPU-only torch (2026-10-21), as in the `test` job: see the comment there.
        env:
          PIP_EXTRA_INDEX_URL: https://download.pytorch.org/whl/cpu
        run: pip install -e ".[dev]" "torch>=2.6.0" ${{ needs.plan.outputs.constraints }}

      - name: Warm tiny GPT-2 cache
        if: needs.plan.outputs.docs_only != 'true'
        shell: python
        run: |
          from huggingface_hub import snapshot_download

          snapshot_download(
              "sshleifer/tiny-gpt2",
              allow_patterns=["*.json", "*.txt", "*.bin"],
          )

      - name: Run PyTorch smoke tests
        if: needs.plan.outputs.docs_only != 'true'
        run: python -m pytest -o addopts= -m smoke -q tests/
      - name: Save PyTorch smoke HF cache
        if: needs.plan.outputs.docs_only != 'true' && success() && steps.hf-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: ${{ runner.temp }}/hf-cache
          key: hf-pytorch-smoke-${{ runner.os }}-${{ hashFiles('tests/test_smoke_train.py', 'pyproject.toml') }}

  # #1802: the training stack requires newer core dependencies, so its floor job
  # cannot exercise every light-core floor. Install only the core here, on the
  # oldest supported Python (PyYAML 6.0 has wheels for it), and start the CLI.
  # 3.11 since #1805; PyYAML 6.0 and pydantic-core 2.0.1 ship cp311 manylinux wheels.
  core-floor:
    needs: plan
    if: needs.plan.outputs.full == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PYTHONUTF8: "1"
      PYTHONIOENCODING: "utf-8"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Isolate core floors from runner tooling
        # Runner/image tooling can require newer packages (wheel>=0.46 needs
        # packaging>=24) than the core floor. Keep that graph outside this cell.
        run: |
          python -m venv "$RUNNER_TEMP/soup-core-floor"
          echo "$RUNNER_TEMP/soup-core-floor/bin" >> "$GITHUB_PATH"
      - name: Install the declared core dependency floors
        # pytest 9 requires packaging>=22, above Soup's packaging>=21 floor.
        # The test runner is tooling, so keep its compatible major here.
        run: pip install -e . "pytest>=7,<9" -c .github/constraints/core-floor.txt
      - name: Verify constrained core dependency graph
        run: python -m pip check
      - name: Assert core floor versions
        shell: python
        run: |
          import importlib.metadata as md
          import importlib.util
          import re
          from pathlib import Path

          from packaging.version import Version

          constraints = Path(".github/constraints/core-floor.txt").read_text(encoding="utf-8")
          pairs = re.findall(r"^([A-Za-z0-9_-]+)==([^\s#]+)\s*$", constraints, re.MULTILINE)
          expected = dict(pairs)
          assert expected and len(expected) == len(pairs), "missing or duplicate core pins"
          for name, want in expected.items():
              got = md.version(name)
              assert Version(got) == Version(want), f"core-floor expected {name}=={want}, got {got}"
              print(f"{name}={got} (matches declared floor)")
          for name in ("torch", "transformers", "accelerate", "peft", "trl", "datasets", "bitsandbytes"):
              assert importlib.util.find_spec(name) is None, f"core-floor installed {name}"
      - name: Run core floor command tree, help and startup checks
        run: >
          pytest -o addopts= -q
          tests/test_core_dependency_floors.py
          tests/test_cli_dependency_floors.py
          tests/test_typer_click_compat.py
          tests/test_cli_runner.py
          tests/test_click_argument_help.py
          tests/test_cli_startup_is_light.py
          tests/test_cli.py
          tests/test_cli_subprocess.py
          tests/test_plotext_compat.py

  # #502/#503/#522/#571/#651: install the exact Torch 2.6.0 / Transformers 5.16.1 /
  # trl 0.29 / PEFT 0.20 support stack and Plotext 6.0.0 so pip cannot silently
  # upgrade the cell, then assert every pinned compatibility boundary.
  # #1802: the same file pins Typer and Click to the floors pyproject.toml declares,
  # and the last step starts the CLI on them, alongside the core-only cell above.
  # The ordinary test matrix resolves the newest Typer, which is how a floor no
  # command could run on stayed declared. Keep the name; branch protection requires it.
  transformers-floor:
    needs: plan
    if: needs.plan.outputs.full == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PYTHONUTF8: "1"
      PYTHONIOENCODING: "utf-8"
    # Every step below carries `if: needs.plan.outputs.docs_only != 'true'` (2026-10-20): a
    # docs-only pull request reports this job as SUCCESS without doing its work (see the
    # comment above `plan`). A step added here needs the same condition.
    steps:
      - uses: actions/checkout@v4
        if: needs.plan.outputs.docs_only != 'true'
      - uses: actions/setup-python@v5
        if: needs.plan.outputs.docs_only != 'true'
        with:
          python-version: "3.11"
      - name: Install with Transformers floor constraints
        if: needs.plan.outputs.docs_only != 'true'
        # CPU-only torch and torchaudio (2026-10-21), as in the `test` job: see the comment
        # there. 2.6.0+cpu exists on the CPU index for cp311, cp312 and cp313 (linux x86_64)
        # for both, and the pins in transformers-floor.txt accept it (PEP 440). The version
        # it reports is `2.6.0+cpu`, which the next-but-one step compares by public version.
        env:
          PIP_EXTRA_INDEX_URL: https://download.pytorch.org/whl/cpu
        run: pip install -e ".[dev,audio]" -c .github/constraints/transformers-floor.txt
      - name: Verify constrained dependency graph
        if: needs.plan.outputs.docs_only != 'true'
        run: python -m pip check
      - name: Assert installed versions match floor constraints
        if: needs.plan.outputs.docs_only != 'true'
        run: |
          python - <<'PY'
          import importlib.metadata as md
          import re
          from pathlib import Path

          from packaging.version import Version

          constraints = Path(".github/constraints/transformers-floor.txt").read_text(
              encoding="utf-8"
          )
          pairs = re.findall(
              r"^([A-Za-z0-9_-]+)==([^\s#]+)\s*$",
              constraints,
              re.MULTILINE,
          )
          expected = dict(pairs)
          assert len(expected) == len(pairs), "duplicate package pin in floor constraints"
          for name in (
              "torch", "torchaudio", "transformers", "trl", "peft", "plotext",
              "typer", "click",  # #1802: the CLI's own declared floors
          ):
              assert name in expected, f"floor constraints missing exact {name} pin"
              want = expected[name]
              got = md.version(name)
              # The public part: a CPU wheel reports `2.6.0+cpu` for the pin `==2.6.0`.
              assert Version(got).public == want, (
                  f"floor job expected {name}=={want} from "
                  f".github/constraints/transformers-floor.txt, got {got} — "
                  f"pip silently upgraded, ignored -c, or constraints drifted"
              )
              print(f"{name}={got} (matches constraints)")
          PY
      - name: Prove the pinned torch actually supports trl's FSDP2 path
        if: needs.plan.outputs.docs_only != 'true'
        run: |
          python - <<'PY'
          import torch
          import torch.distributed.fsdp as fsdp

          assert hasattr(fsdp, "FSDPModule"), (
              "torch.distributed.fsdp.FSDPModule is absent — this is the #651 "
              "root cause; the declared torch floor does not support trl 0.29"
          )
          import trl
          from trl import DPOTrainer, KTOTrainer

          print(
              "trl",
              trl.__version__,
              "imports on torch",
              torch.__version__,
          )
          PY
      - name: Run Transformers floor compatibility guard
        if: needs.plan.outputs.docs_only != 'true'
        run: >
          pytest -o addopts= --no-cov -q
          tests/test_transformers_floor_compat.py
          tests/test_issue571_qwen4_exp.py
          tests/test_plotext_compat.py
          tests/test_bugfixes.py::TestDiffModelLoading
          tests/test_issue636_torch_floor.py
          tests/test_issue265_xcodec2_audio_contract.py
          tests/test_native_csm.py
          tests/test_cli_dependency_floors.py
          tests/test_click_argument_help.py
          tests/test_cli_startup_is_light.py
          tests/test_typer_click_compat.py
          tests/test_cli_help_completeness.py
          tests/test_cli_help_markup.py
          tests/test_gen_reference_docs.py
          tests/test_cli_runner.py

  typer-vendored:
    needs: plan
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    # Keep the pinned vendored probe off PR/release runs to preserve CI capacity.
    # Exercise these identities nightly/manually without upgrading either floor.
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install pinned vendored Typer compatibility lane
        run: python -m pip install -e . "pytest>=7,<9" "typer==0.27.3" "click==8.4.2"
      - name: Verify pinned vendored identities and compatibility scenarios
        env:
          PYTEST_DISABLE_PLUGIN_AUTOLOAD: "1"
          HF_HUB_OFFLINE: "1"
          TRANSFORMERS_OFFLINE: "1"
        run: |
          python - <<'PY'
          import json
          from importlib.metadata import version
          import click
          from typer._click.core import Command, Context, ParameterSource
          from typer._click.exceptions import MissingParameter, UsageError
          from typer.core import TyperGroup
          from typer.main import get_command
          from soup_cli.cli import app
          from soup_cli.utils import typer_compat

          installed = {name: version(name) for name in ("typer", "click")}
          assert installed == {"typer": "0.27.3", "click": "8.4.2"}, installed
          assert TyperGroup.__bases__[0] is Command
          root = get_command(app)
          assert isinstance(root, Command) and not isinstance(root, click.Command)
          assert typer_compat.UsageError is UsageError and UsageError is not click.UsageError
          assert typer_compat.MissingParameter is MissingParameter
          assert MissingParameter is not click.MissingParameter
          assert typer_compat.ParameterSource is ParameterSource
          assert ParameterSource is not click.core.ParameterSource
          with root.commands["ship"].make_context("ship", []) as context:
              assert isinstance(context, Context)
              assert context.get_parameter_source("forgetting_threshold") is ParameterSource.DEFAULT
          print(json.dumps({**installed, "command_base": Command.__module__,
                            "usage_error": UsageError.__module__,
                            "parameter_source": ParameterSource.__module__}, sort_keys=True))
          PY
          python -m pytest -o addopts= tests/test_typer_click_compat.py -q

  test:
    needs: plan
    strategy:
      fail-fast: false
      # From `plan`: all nine cells on a push to release/**, seven on the nightly
      # run and a manual dispatch (no Windows or macOS 3.11), the four required
      # ones on a labelled pull request, test (ubuntu-latest, 3.12) alone on a
      # quick one. The cells a run leaves out are MISSING, not skipped, and that
      # is what keeps a required one blocking a merge.
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    env:
      # Force UTF-8 mode on all platforms. Without this, Windows defaults to
      # cp1252 ('charmap'), which fails when importing upstream packages that
      # read their own source / data files without an explicit encoding
      # (seen with trl.trainer.grpo_trainer on windows-latest / py3.11).
      PYTHONUTF8: "1"
      PYTHONIOENCODING: "utf-8"
      # Whether this cell does any work (2026-10-20). `true` for every cell of every run
      # except a docs-only pull request (see the comment above `plan`), where only
      # `test (ubuntu-latest, 3.12)` keeps it: that cell runs the full suite as before and
      # the others report SUCCESS with every step skipped. EVERY step below carries
      # `env.RUN_SUITE == 'true'` in its `if:`; a step added here needs it too, or it runs
      # (and installs) on the cells that were meant to do nothing.
      RUN_SUITE: ${{ needs.plan.outputs.docs_only != 'true' || (matrix.os == 'ubuntu-latest' && matrix.python-version == '3.12') }}
    steps:
      - uses: actions/checkout@v4
        if: env.RUN_SUITE == 'true'
      - uses: actions/setup-python@v5
        if: env.RUN_SUITE == 'true'
        with:
          python-version: ${{ matrix.python-version }}
        # No pip cache (dropped 2026-10-19; it was ubuntu / 3.12 only). Measured over the
        # last 12 pull-request runs: the cached ubuntu / 3.12 cell spent 0.49 min (0.33
        # to 0.60) restoring the cache plus 1.54 min installing = 2.03 min, the uncached
        # ubuntu / 3.10 cell (3.11 since #1805) 1.80 min installing, so the cache cost more
        # than it saved.
        # It also held 6.1 GB of the 8.8 GB the repository uses of its 10 GB Actions
        # cache (two 3 GB entries, a new one whenever pyproject.toml or a constraints
        # file changes), which is what evicted the small HF caches.
      # The Web UI escaping tests run `safe_html.js` under node, and skip when
      # node is absent. Runner images happen to ship one, so the skip would be
      # silent: pin it, or the only tests that execute the real escaping logic
      # can disappear without anything turning red.
      - uses: actions/setup-node@v4
        if: env.RUN_SUITE == 'true'
        with:
          node-version: "22"
      - name: Pin the HF cache to a deterministic path
        if: env.RUN_SUITE == 'true'
        # Set here and not in the job-level `env:` block: the `runner` context
        # is not available there (only github / needs / strategy / matrix /
        # vars / secrets / inputs are), and referencing it makes GitHub reject
        # the whole workflow file before any job starts.
        #
        # Why a fixed path at all: the default ~/.cache/huggingface sits under
        # a different user on each runner OS, so actions/cache cannot restore
        # it by one key. Kept OUTSIDE the checkout because it lands ~0.5 GB,
        # which the tests that walk cwd for containment would otherwise scan.
        shell: bash
        run: echo "HF_HOME=$RUNNER_TEMP/hf-cache" >> "$GITHUB_ENV"
      - name: Restore HF Hub cache
        if: env.RUN_SUITE == 'true'
        id: hf-cache
        uses: actions/cache/restore@v4
        with:
          path: ${{ runner.temp }}/hf-cache
          # Keyed on this file, so editing the model list below re-warms.
          key: hf-${{ runner.os }}-${{ hashFiles('.github/workflows/ci.yml') }}
          restore-keys: hf-${{ runner.os }}-
      - name: Install dependencies
        if: env.RUN_SUITE == 'true'
        # pytest-xdist runs the suite in parallel (see the test step below); its
        # psutil extra is what `-n logical` counts the CPUs with. Installed here
        # and not in the dev extra: a local run stays serial unless a contributor
        # asks for workers.
        # Ends with `plan`'s stack: pinned on a pull request and a push to main, the newest at night.
        #
        # 2026-10-21: the Linux cells install the CPU-only torch wheel. PyPI's Linux torch
        # drags in the CUDA stack (19 packages, 2.43 GB beside the 555 MB torch wheel for
        # 2.14.1) on runners that have no GPU; the CPU wheel (196 MB, no nvidia-* and no
        # triton) comes from PyTorch's own index. `PIP_EXTRA_INDEX_URL`, not a flag on the
        # command: the line above is pinned by tests/test_ci_full_matrix_on_approval.py, and
        # PyPI stays the main index for every other package (the CPU index mirrors only
        # older or equal copies of them). On this step only, so a pip a test runs is not
        # redirected. Windows and macOS already get CPU wheels from PyPI, so it is empty
        # there. `torch==2.14.1` and `torch>=2.6.0` both accept `2.14.1+cpu` (PEP 440) and
        # pip prefers the local version to PyPI's plain one. If PyPI ever has a torch the CPU
        # index does not, the CUDA wheel is resolved silently: the install log says which.
        # tests/test_ci_cpu_torch_on_linux.py pins every job that does this.
        env:
          PIP_EXTRA_INDEX_URL: ${{ runner.os == 'Linux' && 'https://download.pytorch.org/whl/cpu' || '' }}
        run: pip install -e ".[dev]" "pytest-xdist[psutil]" ${{ needs.plan.outputs.constraints }}
      - name: Warm HF Hub cache (models the tests load)
        if: env.RUN_SUITE == 'true'
        # Pre-download the models the unit tests load, with retries, so a
        # transient HF Hub 429 (Too Many Requests) on a single matrix cell does
        # not red the whole run. Never fails the job: if warming can't complete
        # it emits a ::warning:: and lets the test step run as before.
        #
        # The list is EMPIRICAL — it is what a full local run actually leaves in
        # ~/.cache/huggingface, not what greps for repo-shaped strings in
        # tests/ suggest (most of those are config fixtures that never
        # download). The list grew because run 30942028585 reddened
        # windows/3.10 (a cell that left the matrix with #1805) on a 429 for
        # SmolLM2-135M-Instruct/config.json — a repo
        # this step did not warm, so the retry loop above never protected it.
        #
        # "gpt2" is deliberately unqualified: tests ask for the bare id, which
        # caches as models--gpt2. Warming "openai-community/gpt2" instead would
        # fill a different directory and every test would still miss.
        #
        # 2026-10-19: on macOS and Windows this step failed on `gpt2` in EVERY cell since
        # about 2026-10-16 17Z -- the Hub answers 404 on
        # `/api/models/gpt2/xet-read-token/<sha>`, the token the hf_xet download path asks
        # for, and a 404 is retried like a 429 until the budget runs out. Measured over the
        # last 12 pull-request runs: 6.3 min per macOS and Windows cell (6.25 to 6.37),
        # about 57 cells a day = 362 runner-minutes a day, and the cache was never
        # saved (`warmed` stayed `partial`), so every cell paid it again. Linux never hit it
        # because its restored cache already held the file. HF_HUB_DISABLE_XET (read by
        # huggingface_hub's constants.py, in v2.2.0 which the pinned stack installs and in
        # the newest release) makes `is_xet_available()` false, so the download takes the
        # plain HTTP path and never asks for that token. The budget below is 120 s, not
        # 360: it is only ever spent in full when the Hub is refusing a repo, and a step
        # that cannot warm everything never fails the job anyway.
        id: warm
        shell: python
        env:
          HF_HUB_DISABLE_XET: "1"
        run: |
          import os
          import time
          from huggingface_hub import snapshot_download

          # Per-repo file sets, also empirical: these are the files a populated
          # local cache actually holds after running the suite. Downloading
          # whole snapshots instead costs 1.6 GB per cell — mostly the TF /
          # Flax copies and the pytorch_model.bin twin of a safetensors file
          # that transformers never opens when safetensors is present.
          TEXT_ONLY = ["*.json", "*.txt", "*.model"]      # config + tokenizer
          SAFETENSORS = TEXT_ONLY + ["*.safetensors"]
          # Two of the fixture repos predate safetensors and ship weights ONLY
          # as pytorch_model.bin. Both are a few MB, so pulling the .bin costs
          # nothing here — but excluding it left the ASR test unable to build a
          # model offline, which a full offline run of the suite caught.
          LEGACY_BIN = TEXT_ONLY + ["*.bin"]

          models = [
              ("sshleifer/tiny-gpt2", LEGACY_BIN),
              ("hf-internal-testing/tiny-random-gpt2", SAFETENSORS),
              ("hf-internal-testing/tiny-random-LlamaForCausalLM", SAFETENSORS),
              ("hf-internal-testing/tiny-random-WhisperForConditionalGeneration", LEGACY_BIN),
              # Weights are never loaded for these two — only the config the
              # 429 above was raised on.
              ("HuggingFaceTB/SmolLM2-135M", TEXT_ONLY),
              ("HuggingFaceTB/SmolLM2-135M-Instruct", TEXT_ONLY),
              ("gpt2", SAFETENSORS),
          ]

          # One budget for the whole list, not per repo. Run 30947949103
          # showed why: on windows/3.11 ALL SIX repos failed EVERY attempt,
          # including the tiny fixtures every other cell fetched in under a
          # second. The Hub had cut that runner off for the duration — so
          # burning a fresh retry ladder on repo #2 the moment repo #1 gave up
          # just spends the budget faster without ever waiting out the block.
          deadline = time.monotonic() + 120
          pending = list(models)
          delay = 10

          while pending and time.monotonic() < deadline:
              still_pending = []
              for repo, allow in pending:
                  try:
                      snapshot_download(repo, allow_patterns=allow)
                      print(f"warmed {repo}")
                  except Exception as exc:  # noqa: BLE001 — best effort, never fail the job
                      print(f"{repo}: {type(exc).__name__}: {exc}")
                      still_pending.append((repo, allow))
              pending = still_pending
              if pending:
                  print(f"{len(pending)} repo(s) left; retrying in {delay}s")
                  time.sleep(delay)
                  delay = min(delay * 2, 60)

          for repo, _ in pending:
              print(f"::warning title=HF cache::could not warm {repo} within the retry budget")

          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as fh:
              fh.write(f"warmed={'partial' if pending else 'all'}\n")
      - name: Save HF Hub cache
        # Only a COMPLETE warm is saved. A partial one would freeze the very
        # gap this step exists to close: the key is content-addressed, so a
        # cache written while a model was 429-ing is never replaced, and every
        # later run would restore the same hole.
        #
        # ANY cell may save, deliberately. Restricting this to 3.11 to avoid
        # redundant uploads is what left Windows with no cache at all in run
        # 30947949103: 3.11 was the one cell the Hub cut off, so the two
        # healthy Windows cells were not allowed to save what they had. The
        # losers of the resulting race log "unable to reserve cache" and move
        # on, which is far cheaper than an OS that never gets a cache.
        if: always() && env.RUN_SUITE == 'true' && steps.warm.outputs.warmed == 'all' && steps.hf-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: ${{ runner.temp }}/hf-cache
          key: hf-${{ runner.os }}-${{ hashFiles('.github/workflows/ci.yml') }}
      - name: Run unit tests with coverage
        # One worker per logical CPU and one test FILE per worker (`loadfile`):
        # the tests of a file keep their order and their module-level state, and
        # two files may run at the same moment. Measured 2026-10-07 on Python
        # 3.12 (run 37577416935): ubuntu 2520 s -> 1133 s, Windows 4492 s ->
        # 1390 s, macOS 2003 s -> 992 s, with the same tests passing and coverage
        # unchanged. `--dist load` hands the tests of one file to several workers
        # and is not used: it was no faster, and one timing test failed under it.
        #
        # 2026-10-19: coverage is measured in ONE cell, ubuntu / 3.11 (3.10 until #1805,
        # the oldest supported Python either way), the cell that uploads it. The 77% floor
        # (`--cov-fail-under` in pyproject.toml's `addopts`) is enforced there; every other
        # cell runs the next step with `--no-cov`, which turns the tracer and the floor off
        # for it. A coverage floor measured on seven more
        # cells says nothing the one cell does not, and the tracer slows the suite on all
        # of them: measured locally, serial, on 147 CLI tests (Python 3.12), 33 s without
        # coverage and 85 s with it (CI itself is not measured yet). The two steps carry
        # opposite conditions, so exactly one runs in a cell.
        #
        # 2026-10-21: and only outside a pull request. The ruling of that day was coverage
        # "only on push to main and nightly", about 165 job-minutes a day: the approval run
        # of every pull request ran this step in ubuntu / 3.11 and paid the tracer there.
        # `github.event_name != 'pull_request'` is on this step and on the upload below,
        # and the opposite (`== 'pull_request' ||`) on the next one, so a pull request runs
        # the next step in every cell, ubuntu / 3.11 included, and still writes report.xml.
        # This step runs for the nightly run, a manual dispatch and a push to release/**.
        # A push to `main` is QUICK (ubuntu / 3.12 only) and has no ubuntu / 3.11 cell, so it
        # runs the next step as before: it never measured coverage, and the ruling's "a drop
        # shows on the merge commit" would need the quick cell to measure it, which costs the
        # tracer on every push to main (see tests/test_ci_full_matrix_on_approval.py,
        # TestCoverageIsMeasuredInOneCell).
        #
        # 2026-10-20: a hung test is capped three ways. `--timeout=600 --timeout-method=thread`
        # (pytest-timeout, in the dev extra) fails ONE test that has run for ten minutes: the
        # thread method works on Windows (no SIGALRM there) and in an xdist worker, which it
        # kills with `os._exit` after dumping every stack, so xdist reports "worker crashed" on
        # that test and starts another worker. Measured with xdist 3.8.0 (a scratch run on
        # Windows, a sleeping test under `-n 2 --dist loadfile`): `loadfile` hands the crashed
        # test to the replacement worker AGAIN, and it failed on every replacement until the
        # default limit of four restarts per worker (9 failures of one test in that run), which
        # at ten minutes each would outlast the step. `--max-worker-restart=2` bounds it at three
        # tries, 30 minutes, and a one-off wedge still passes on the retry (the run stays red:
        # the first failure is kept). `timeout-minutes: 45` on the step is the backstop for a
        # hang neither can see (a worker that never exits). `-o faulthandler_timeout=300`
        # (pytest's own, no dependency) dumps every thread's stack into the log once a test has
        # run for five minutes, before the cap above ends it, so a hang leaves its location in
        # the log of the cell that hit it (checked under `-n 2` with a sleeping test: the dump
        # comes from the worker, one per attempt). Why: in the nightly run of 2026-10-20,
        # `test (windows-latest, 3.10)` (gone since #1805) ran to the job's 90-minute limit
        # inside ONE test
        # (tests/test_mcp_capacity_all_runs.py::test_launching_run_older_than_list_window_blocks,
        # started 03:56:45, the other four workers idle from then on), and a macOS pull-request
        # cell of 2026-10-13 held its runner for 46 minutes. Measured: the slowest single test
        # in four recent full cells (ubuntu, macOS, Windows) took under 51 s (the gap between
        # two finished tests of one worker, an upper bound), and the longest test step of the
        # last 7 days took 27.7 minutes, so none of the caps can fire on a healthy run. A test
        # that needs longer marks itself `@pytest.mark.timeout(N)`.
        if: env.RUN_SUITE == 'true' && github.event_name != 'pull_request' && matrix.os == 'ubuntu-latest' && matrix.python-version == '3.11'
        timeout-minutes: 45
        run: pytest tests/ -n logical --dist loadfile -v --tb=short -o faulthandler_timeout=300 --timeout=600 --timeout-method=thread --max-worker-restart=2 --junitxml=report.xml --cov=soup_cli --cov-report=xml:coverage.xml --cov-report=term-missing:skip-covered
      - name: Run unit tests without coverage
        # Same options as the step above minus the coverage reports; `--junitxml` stays in
        # both, because the nightly test-count badge reads report.xml from ubuntu / 3.11,
        # which runs the step above (it is a schedule run, never a pull request) and ran
        # this one before #1805: with it in both, moving the badge or the coverage cell
        # cannot leave the badge without a report, and a pull request still writes one.
        # The exact opposite of the step above: every cell of a pull request, and every cell
        # of any run but ubuntu / 3.11. The same two caps.
        if: env.RUN_SUITE == 'true' && (github.event_name == 'pull_request' || matrix.os != 'ubuntu-latest' || matrix.python-version != '3.11')
        timeout-minutes: 45
        run: pytest tests/ -n logical --dist loadfile -v --tb=short -o faulthandler_timeout=300 --timeout=600 --timeout-method=thread --max-worker-restart=2 --junitxml=report.xml --no-cov
      - name: Upload coverage to Codecov
        # The cell that measures coverage, nowhere else: ubuntu / 3.11 of a run that is not a
        # pull request (release, nightly, manual dispatch), the same condition as "Run unit
        # tests with coverage" -- a pull request has no coverage.xml to send. It was 3.11
        # until the approval run of 2026-10-07 stopped having that cell, 3.10 from then
        # on, and 3.11 again since #1805 made it the oldest.
        if: env.RUN_SUITE == 'true' && github.event_name != 'pull_request' && matrix.os == 'ubuntu-latest' && matrix.python-version == '3.11'
        uses: codecov/codecov-action@v4
        with:
          files: coverage.xml
          fail_ci_if_error: false
      - name: Update test count badge
        if: env.RUN_SUITE == 'true' && matrix.os == 'ubuntu-latest' && matrix.python-version == '3.11' && github.ref == 'refs/heads/main' && github.event_name == 'schedule' && github.repository == 'MakazhanAlpamys/Soup'
        run: |
          TESTS=$(python -c "
          import xml.etree.ElementTree as ET
          root = ET.parse('report.xml').getroot()
          ts = root.find('testsuite')
          print(ts.attrib.get('tests', '0') if ts is not None else root.attrib.get('tests', '0'))
          ")
          echo "Test count: $TESTS"
          # --fail-with-body: surface non-2xx (e.g. 401 expired token) as a
          # CI failure with the response body printed, instead of silently
          # discarding to /dev/null and leaving the badge stale.
          curl --fail-with-body -sS \
            -X PATCH \
            -H "Authorization: token ${{ secrets.GIST_TOKEN }}" \
            -d "{\"files\":{\"soup_tests.json\":{\"content\":\"{\\\"schemaVersion\\\":1,\\\"label\\\":\\\"tests\\\",\\\"message\\\":\\\"$TESTS passed\\\",\\\"color\\\":\\\"brightgreen\\\"}\"}}}" \
            "https://api.github.com/gists/65fdc943f85f3b2c46ecddb415c2b779"
