# GRPO Reasoning Example
# Fine-tune a reasoning model (math, logic, step-by-step) with Group Relative
# Policy Optimization: several completions are generated per prompt and scored
# by a reward function.
#
# The bundled dataset is a 5-row FORMAT sample, not a training set.
# Point `data.train` at your own reasoning data for a real run.
# See examples/data/README.md.
#
# Usage:
#   soup train --config examples/configs/grpo_reasoning.yaml

base: TinyLlama/TinyLlama-1.1B-Chat-v1.0
task: grpo
backend: transformers

data:
  train: examples/data/reasoning_math.jsonl
  format: alpaca
  # 512, not 2048: the longest row in any bundled fixture is ~233 tokens, so
  # nothing is truncated and there is 2x headroom. A larger value only inflates
  # the activation memory the VRAM pre-flight budgets for. Raise it when you
  # point this config at longer data of your own.
  max_length: 512

training:
  epochs: 2
  lr: 1e-4
  batch_size: 4  # must stay a multiple of num_generations
  gradient_accumulation_steps: 2
  quantization: none
  scheduler: cosine
  warmup_ratio: 0.1
  weight_decay: 0.01
  logging_steps: 10
  save_steps: 50
  grpo_beta: 0.05
  num_generations: 4
  reward_fn: accuracy  # built-in reward function
  lora:
    r: 64
    alpha: 128
    dropout: 0.05
    target_modules:
      - q_proj
      - v_proj

output: ./output_reasoning/
